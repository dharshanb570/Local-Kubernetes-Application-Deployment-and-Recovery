
apiVersion: apps/v1
kind: Deployment

metadata:
  name: local-k8s-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: local-k8s-app

  template:
    metadata:
      labels:
        app: local-k8s-app

    spec:
      containers:
        - name: flask-container
          image: local-k8s-demo:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
