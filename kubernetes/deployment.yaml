apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-kubernetes-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-kubernetes-app

  template:
    metadata:
      labels:
        app: my-kubernetes-app

    spec:
      containers:
        - name: flask-container
          image: my-kubernetes-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

